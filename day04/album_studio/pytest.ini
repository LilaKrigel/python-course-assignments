[pytest]
testpaths = tests
# When a test fails, pytest prints the log of what the app did in that test ("Captured log"):
# every line with the file, line and function it came from. See tests/README.md.
log_format = %(levelname)-5s %(filename)s:%(lineno)d %(funcName)s() | %(message)s
# To watch the same log while the tests run (also for passing tests), e.g. for one test:
#   python -m pytest tests -k test_name -o log_cli=true --log-cli-level=DEBUG
log_cli_format = %(levelname)-5s %(filename)s:%(lineno)d %(funcName)s() | %(message)s
